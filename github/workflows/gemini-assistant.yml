name: Gemini CLI Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write      # Essential: Allows Gemini to edit and push code
  issues: write        # Allows Gemini to update issues
  pull-requests: write # Allows Gemini to create/modify PRs

jobs:
  gemini-assistant:
    # Run only when someone mentions @gemini-cli in an issue or PR comment
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI Agent
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
