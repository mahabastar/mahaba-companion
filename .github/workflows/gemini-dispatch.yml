name: Gemini Dispatch

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  dispatch:
    if: |
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@gemini-cli')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@gemini-cli'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read the user's request from the GitHub issue or comment.

            Work on the repository carefully and follow the user's
            instructions.

            Before making changes, inspect the relevant files and
            understand the existing code.

            Do not make unnecessary changes.
            Do not remove existing functionality.
            Do not change secrets or environment variables.

            If the user asks for analysis only, do not modify files.

            If the user asks for a code change, make the smallest safe
            change necessary and verify the result.
